<!DOCTYPE html>
<html>
<head>
<title>Layout Design</title>
</head>

<body>

<table border="1" width="600" height="700" align="center">

<!-- Top two boxes -->
<tr height="80">
<td width="300"></td>
<td width="300"></td>
</tr>

<!-- Large box -->
<tr height="350">
<td colspan="2"></td>
</tr>

<!-- Middle small box -->
<tr height="100" width="50px">
<td colspan="2"></td>
</tr>

<!-- Bottom box -->
<tr height="120">
<td colspan="2"></td>
</tr>

</table>

</body>
</html>
